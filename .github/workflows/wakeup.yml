name: NSE API Warmup Schedule IST

on:
  schedule:
    # 08:00 AM to 08:50 AM IST (02:30 to 02:50 UTC)
    - cron: '30,40,50 2 * * *'
    # 09:00 AM to 11:20 PM IST (03:30 to 17:50 UTC)
    - cron: '*/10 3-17 * * *'
    # 11:30 PM to 12:00 AM IST (18:00 to 18:30 UTC)
    - cron: '0,10,20,30 18 * * *'
  workflow_dispatch:

jobs:
  warmup-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cache for Warmup Strategy
        id: cache-warmup
        uses: actions/cache@v3
        with:
          path: .cache/warmup_timestamp
          # Changed key to use github.run_id to ensure cache is saved every time
          key: ${{ runner.os }}-warmup-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-warmup-

      - name: Call NSE API with JWT
        run: |
          mkdir -p .cache
          CURRENT_TIME=$(date +%s)
          
          # Call the API using JWT from secrets
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.WAKEUP }}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" -eq 200 ]; then
            echo "API Warmup Successful at $(date)"
            echo "$CURRENT_TIME" > .cache/warmup_timestamp
          else
            echo "API Warmup Failed with status: $RESPONSE"
            exit 1
          fi
