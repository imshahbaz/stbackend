name: NSE API Warmup IST

on:
  schedule:
    # 1. 02:30 UTC to 02:50 UTC (8:00 AM to 8:20 AM IST)
    - cron: '30,40,50 2 * * *'
    # 2. 03:00 UTC to 17:50 UTC (8:30 AM to 11:20 PM IST)
    - cron: '*/10 3-17 * * *'
    # 3. 18:00 UTC to 18:30 UTC (11:30 PM to 12:00 AM IST)
    - cron: '0,10,20,30 18 * * *'
  workflow_dispatch:

jobs:
  warmup-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cache for Warmup Strategy
        id: cache-warmup
        uses: actions/cache@v3
        with:
          path: .cache/warmup_timestamp
          key: ${{ runner.os }}-warmup-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-warmup-

      - name: Call NSE API with JWT
        run: |
          mkdir -p .cache
          # JWT and URL should be stored in GitHub Secrets
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.WARMUP }}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" -eq 200 ]; then
            echo "API Warmup Successful at $(date)"
            date +%s > .cache/warmup_timestamp
          else
            echo "API Warmup Failed with status: $RESPONSE"
            exit 1
          fi
